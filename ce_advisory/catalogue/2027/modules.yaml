# Civil Engineering module catalogue — handbook year 2027
#
# prereq_status is an audit field, not decoration:
#   handbook   verified against the handbook prereq column — trustworthy
#   inferred   derived from the template but interpreted/surprising — VERIFY
#   none       module genuinely has no prerequisites — verified
#   unverified not yet checked at all
#
# `catalogue.unverified_prereqs()` lists everything still outstanding.
# Nothing goes student-facing while that list is non-empty.
#
# Prereq expressions revised against the handbook column of
# Course_insert_sheet_with_prereqs.xlsx. Level gates live in progression.yaml
# and are referenced with `prerequisites: {gate: <name>}`.

