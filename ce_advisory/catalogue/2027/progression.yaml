# §1 tree entry, extended with the live vocabulary found in Session 3.
# SUSP, RISU and COND are decision D3a — unassigned until Dillip signs off.
tree_entry:
  A: [null, GREEN, BLUE, CO]
  B: [RISK, RSK2]
  C: [FPRR, FPRD, PROB, FPMA, FPDS, RAPB, RDPB, RASD, RDSD, RAAD, RDAD, RTA, RAFC,RISU]
  unassigned: [SUSP, COND]   # D3a — blocks any student carrying these

# D1: which periods advance the semester counter. Flip once signed off.
semesters_completed:
  count_blocks: ["1", "2"]
  count_supp_only_periods: false
  count_gap_years: false

# ==========================================================================
# LEVEL GATES  (new)
# ==========================================================================
# Registration gates for modules that carry no *module-specific* prerequisite
# but are gated on aggregate attainment (credits / level / year of study /
# whole-set completion). Source: handbook prereq column
# (Course_insert_sheet_with_prereqs.xlsx). A module opts in with
# `prerequisites: {gate: <name>}` in modules.yaml; the loader inlines the
# expression and expands the group names below into explicit module lists.
#
# Grammar (all resolved before evaluation):
#   passed_at_level      {level, credits}          credits passed at a level
#   credits_at_least     N                         total passed credits
#   credits_from         {group, at_least}         credits passed within a set
#   passed_all           <group|preceding_core>    every module in a set passed
#   year_of_study        {at_least}                current year of study
#   semesters_registered {at_least}                registered-semester counter (D1)
#
# `preceding_core` is computed per module: all core (degree, non-DP, non-
# elective) modules in earlier semesters of the programme.

groups:
  # Named module sets referenced by the gates below. Edit membership here —
  # it is the single source of truth.
  first_year_core:
    [CHEM181, ENCH1TC, ENME1DR, MATH131, MATH132, PHYS151,
     CHEM191, ENCV1ED, ENME1EM, MATH141, MATH142, PHYS152]
  second_year_core:
    [ENCV2MT, ENCV2SA, ENSV2SE, MATH238,
     ENCV2FL, ENCV2SB, ENCV2SD, GEOL215, MATH248]

level_gates:
  # ENSV2SE, GEOL215 — "≥62cr Level 1, ≥32cr core, ≥2 semesters registered".
  # VERIFY (D-item): the "≥32cr core" scope is read here as ≥32 credits from
  # the level-1 engineering core (first_year_core). Confirm against handbook.
  survey_geology_entry:
    all_of:
      - passed_at_level: {level: 1, credits: 62}
      - credits_from: {group: first_year_core, at_least: 32}
      - semesters_registered: {at_least: 2}

  # ENCV3G1 — "≥144cr total, ≥32cr Level 2, passed all 1st year".
  geotech1_entry:
    all_of:
      - credits_at_least: 144
      - passed_at_level: {level: 2, credits: 32}
      - passed_all: first_year_core

  # ENCV3TT — "Must be in 3rd year of study".
  in_third_year:
    year_of_study: {at_least: 3}

  # ENPD7PP, ENPD7CL — "Only students registered in 4th year".
  fourth_year_only:
    year_of_study: {at_least: 4}

  # ENCH4ML — "All 1st-year modules + 96cr of 2nd-year modules".
  eng_management_entry:
    all_of:
      - passed_all: first_year_core
      - credits_from: {group: second_year_core, at_least: 96}

  # ENCV4DE, ENCV4DS — "Passed all preceding core modules in programme".
  final_capstone_entry:
    passed_all: preceding_core

# ==========================================================================
# ELECTIVES  (degree-completion requirements + the Y2S1 choice)
# ==========================================================================
# Electives are checked on AGGREGATE at graduation, not enforced by the
# prerequisite evaluator (the placeholder slots in modules.yaml carry no
# prerequisites, so a student may take them in any semester). A student's real
# elective picks are matched onto these buckets at ERS-parse time by the
# scope below — the free 24 cr bucket can hold literally any module, so it can
# never be a `passed`/`passed_all` node. Total = 16 + 8 + 24 = 48 cr, which
# closes the 528 cr of fixed modules to the 576 cr degree.
#
# scope.college:  caes = College of Agriculture, Engineering & Science only
#                 any  = anywhere in the university
electives:
  - id: elec16                 # Y2S1, displayed against ZULN101 (the common pick)
    credits: 16
    scope: {level: any, college: any}
    slots: [ELEC2E]
    common: [ZULN101]
  - id: college_l4
    credits: 8
    scope: {level: 4, college: caes}
    slots: [ELEC4C]
    common: [ENEL4EE, ENEL4EB]
  - id: free24                 # one 24 cr requirement, laid out as 8 + 16
    credits: 24
    scope: {level: any, college: any}
    slots: [ELEC3E, ELEC4E]
    common: []

# Mutually-exclusive slots: the student fills exactly ONE member of each group;
# the others are not required and do not count toward credits.
choices:
  - id: y2s1_elective
    label: "Year 2 · Semester 1 elective"
    members: [ZULN101, ELEC2E]   # take isiZulu, OR spend the 16 cr on any module
